name: BENApp CI and iOS IPA Build

on:
  push:
    branches:
      - ui/ben-design-system-v1
  workflow_dispatch:
    inputs:
      api_url:
        description: "Local BEN API URL for iPhone testing, e.g. http://192.168.1.24:8080/api (leave blank for UI-only testing)"
        required: false
        type: string
        default: ""

concurrency:
  group: benapp-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, sqlite3

      - name: PHP syntax
        run: find backend -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Tests
        run: flutter test

  build-ios:
    name: Build unsigned iOS IPA
    if: github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Validate test API URL
        env:
          BEN_API_URL_INPUT: ${{ inputs.api_url }}
        run: |
          if [ -n "$BEN_API_URL_INPUT" ]; then
            case "$BEN_API_URL_INPUT" in
              http://*|https://*) ;;
              *) echo "::error::BEN API URL must start with http:// or https://."; exit 1 ;;
            esac
          fi

      - name: Build iOS
        shell: bash
        env:
          BEN_API_URL_INPUT: ${{ inputs.api_url }}
          BEN_MAPTILER_KEY: ${{ secrets.BEN_MAPTILER_KEY }}
        run: |
          flutter build ios --release --no-codesign \
            --dart-define=BEN_API_URL="$BEN_API_URL_INPUT" \
            --dart-define=BEN_MAPTILER_KEY="$BEN_MAPTILER_KEY"

      - name: Create unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -r BENApp-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: BENApp-iOS-unsigned
          path: BENApp-unsigned.ipa
