name: BENApp iOS IPA Build

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build iOS
        shell: bash
        env:
          BEN_API_URL_SECRET: ${{ secrets.BEN_API_URL }}
          BEN_MAPTILER_KEY: ${{ secrets.BEN_MAPTILER_KEY }}
        run: |
          API_URL="$BEN_API_URL_SECRET"
          if [ -z "$API_URL" ]; then
            API_URL="http://192.168.1.24:8080/api"
          fi
          flutter build ios --release --no-codesign \
            --dart-define=BEN_API_URL="$API_URL" \
            --dart-define=BEN_MAPTILER_KEY="$BEN_MAPTILER_KEY"

      - name: Create unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -r BENApp-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: BENApp-iOS-unsigned
          path: BENApp-unsigned.ipa