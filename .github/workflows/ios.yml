name: BENApp CI and iOS IPA Build

on:
  push:
    branches:
      - ui/ben-design-system-v1
  workflow_dispatch:

concurrency:
  group: benapp-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Tests
        run: flutter test

  build-ios:
    name: Build unsigned iOS IPA
    if: github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Validate production API URL
        env:
          BEN_API_URL_SECRET: ${{ secrets.BEN_API_URL }}
        run: |
          if [ -z "$BEN_API_URL_SECRET" ]; then
            echo "::error::Set the BEN_API_URL repository secret to the public HTTPS API endpoint."
            exit 1
          fi
          case "$BEN_API_URL_SECRET" in
            https://*) ;;
            *) echo "::error::BEN_API_URL must use HTTPS for iOS release builds."; exit 1 ;;
          esac

      - name: Build iOS
        shell: bash
        env:
          BEN_API_URL_SECRET: ${{ secrets.BEN_API_URL }}
          BEN_MAPTILER_KEY: ${{ secrets.BEN_MAPTILER_KEY }}
        run: |
          flutter build ios --release --no-codesign \
            --dart-define=BEN_API_URL="$BEN_API_URL_SECRET" \
            --dart-define=BEN_MAPTILER_KEY="$BEN_MAPTILER_KEY"

      - name: Create unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -r BENApp-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: BENApp-iOS-unsigned
          path: BENApp-unsigned.ipa
