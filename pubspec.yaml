name: benapp
description: BEN - Anılar, insanlar ve mekanları birleştirir.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  flutter_map: ^8.2.2
  maplibre_gl: ^0.27.1
  geolocator: ^14.0.3
  latlong2: ^0.9.1
  shared_preferences: ^2.5.3
  image_picker: ^1.2.1
  path_provider: ^2.1.5
  video_player: ^2.10.0
  share_plus: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
    - assets/galata.jpg
    - assets/moda.jpg
    - assets/istanbul.jpg
    - assets/people.jpg
    - assets/sunset.jpg
    - assets/nature.jpg
    - assets/coffee.jpg
